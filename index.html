<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>První cesta | 2D prototyp</title>
  </head>
  <body>
    <main>
      <header><span class="eyebrow">PHASER · 2D PROTOTYP</span><h1>První cesta</h1>

      <p id="status" role="status">Vyber cíl na mapě.</p>
    </main>
    <script type="module" src="/src/main.js"></script>
