name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # A newer main commit supersedes the old deployment; avoid a queue of 10-minute obsolete runs.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate game version and changelog
        run: npm run changelog:validate
      - name: Validate the central version catalog
        run: npm run versions:validate
      - name: Test game systems
        run: npm test
      - name: Verify immutable historical versions
        run: npm run archive:verify
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build for Pages
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base="${BASE_PATH}/"
      - name: Compose unchanged historical files for the complete Pages site
        run: npm run archive:stage
      - name: Browser smoke and save compatibility
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node scripts/ci-smoke.mjs --base="${BASE_PATH}/"
      # Asset Studio is a separate app with relative URLs; it is added under
      # /studio/ after the game checks and never changes the game's files.
      - name: Build Asset Studio
        run: npm run studio:build
      - name: Asset Studio smoke
        run: node scripts/studio-smoke.mjs --no-build
      - name: Add Asset Studio to the site
        run: |
          test ! -e dist/studio
          cp -r dist-studio dist/studio
          test -f dist/studio/index.html && test -f dist/studio/phaser-demo.html
      - name: Upload website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
